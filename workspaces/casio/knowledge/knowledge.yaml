کاسیو:
  meta:
    برند: کاسیو پلاس
    برند_انگلیسی: Casio Plus
    نسخه: 0.4.1
    تاریخ: ۲۰۲۶-۰۸-۰۲
    قالب: YAML تجمیعی
    اسپرینت: 4
    برنامه_اسپرینت:
      - "اسپرینت ۱: پایه‌گذاری فایل و مدل جنرال (HEGAM) + تجمیع ۵۶ پلی‌بوک با
        برچسب داریم/لازم/توسعه"
      - "اسپرینت ۲: استخراج و تزریق محتوای ۱۰ مستند واقعی کاسیو به مدل"
      - "اسپرینت ۳: عمقی‌سازی متدولوژی/معماری (انواع دارایی، سطوح، مدل داده هر
        پلی‌بوک)"
      - "اسپرینت ۴: محتوای آموزشی و کیس‌استادی (جلسات، نقش‌ها، قالب‌ها)"
      - "اسپرینت ۵: اعتبارسنجی، تطابق با مدل جنرال، نسخه‌بندی و خروجی نهایی"
    منشاء_مدل_جنرال: مدل جنرال از اکوسیستم لاپیداری (زمینهٔ جواهر) جنرال شده و اکنون
      برای کاسیو تخصصی (مشخص‌سازی) می‌شود.
  مدل_جنرال:
    نام: HEGAM
    سطوح:
      - "سطح ۱: کاربر پایه": خواندن سند، جست‌وجو، ساخت نوت، لینک داخلی، فولدر، Canvas
      - "سطح ۲: تولیدکننده دارایی": نوشتن نوت استاندارد، Markdown، Canvas، قالب، خروجی قابل تکرار
      - "سطح ۳: معمار دانش": طراحی Vault، MOC، اتصال نوت‌ها، نام‌گذاری، جداسازی دانش
      - "سطح ۴: آماده اتوماسیون": تبدیل پلی‌بوک و داده ساخت‌یافته به ورودی نرم‌افزار/AI
    نقش_های_استاندارد:
      - معمار سیستمسازی
      - طراح متدولوژی
      - تحلیلگر داده
      - مدیر حافظه داده
      - مالک اتوماسیون
      - مستندساز کوچینگ
      - ناظر انطباق و استاندارد
      - کوچ فرایند
    انواع_دارایی:
      - پلی‌بوک
      - قالب
      - رجیستری
      - لاگ
      - مشخصات اتوماسیون
      - مدل داده
      - نقشه/کانواس
      - سند/چارچوب/آیین‌نامه/پروتکل
    وضعیت_های_نرمال:
      - طراحی شده
      - در حال توسعه
      - فعال
      - عملیاتی
      - در حال بهره‌برداری
      - نهایی شده
    اصل_بازگشت_داده: هر دارایی باید مشخص کند خروجی به کجا می‌رود و چه بازخوردی برمی‌گردد.
  مقایسه_جنرال_و_کاسیو:
    توضیح: مدل جنرال برای لاپیداری جنرال شده بود؛ اینجا برای کاسیو مشخص (تخصصی)
      می‌شود. برچسب داریم/لازم نشان می‌دهد کدام دارایی در کاسیو موجود است.
    آمار_داریم: 41
    آمار_لازم: 15
    آمار_توسعه: 18
    فهرست_لازم:
      - Onboarding Playbook
      - پلی‌بوک اجرایی (Playbook)
      - مشخصات اتوماسیون (Automation Spec)
      - مدل داده (Data Model)
      - راهنمای آموزشی Obsidian برای تیم کاسیو
      - رجیستری استانداردها و کدها
      - راهنمای ساخت بنر موضوعی
      - دستورالعمل تولید اینفوگرافیک
      - راهنمای تولید خبرنامه
      - دستورالعمل تولید محتوا زنده از کالست
      - راهنمای استفاده از ابزارهای بله (بات‌ها)
      - برگه کمپین (Campaign Sheet)
      - راهنمای اصول هدایت کارگاه و بازخورد موثر
      - مدل استقرار سیستم‌ها در سازمان (پروژه‌های سازمانی)
      - پیوست اجرایی جدول امتیازدهی اولیه

    تعداد_جلسات: 9
    مسیر_نقش_ها:
      - نقش: معمار سیستمسازی
        دارایی_اصلی: طراحی Vault و کانواس استاندارد
        تمرکز: Canvas استاندارد، MOC، منابع مرزی، پلی‌بوک، استاندارد اختصاصی
        سطح: سطح ۳
        متدولوژی_مرتبط: Zettelkasten (اتمی/پیوندی) + ISO 30401 (طراحی سیستم دانش)
      - نقش: طراح متدولوژی
        دارایی_اصلی: پلی‌بوک قابل تکرار
        تمرکز: تبدیل نوت به پلی‌بوک، قالب، اسکریپت، مسیر یادگیری
        سطح: سطح ۲
        متدولوژی_مرتبط: ADDIE + SECI (برونی‌سازی) — تبدیل دانش به پلی‌بوک
      - نقش: تحلیلگر داده
        دارایی_اصلی: مدل داده و Properties
        تمرکز: Properties، رجیستری، لاگ، مدل داده، داشبورد مفهومی
        سطح: سطح ۴
        متدولوژی_مرتبط: ISO 30401 (سنجش/پایش) + مدل داده
      - نقش: مدیر حافظه داده
        دارایی_اصلی: رجیستری و لاگ تصمیم
        تمرکز: رجیستری تصمیم، لاگ یادگیری، بازگشت داده، نسخه‌بندی
        سطح: سطح ۳
        متدولوژی_مرتبط: Ahrens (نوت دائمی) + ISO 30401 (حافظه دانش)
      - نقش: مالک اتوماسیون
        دارایی_اصلی: مشخصات اتوماسیون
        تمرکز: مشخصات اتوماسیون، ورودی/خروجی داده، خط لوله، آماده‌سازی برای AI
        سطح: سطح ۴
        متدولوژی_مرتبط: میکرولرنینگ/اتوماسیون — آماده‌سازی خروجی برای AI
      - نقش: مستندساز کوچینگ
        دارایی_اصلی: لاگ جلسه با لینک داخلی
        تمرکز: ثبت جلسه، تصمیم، خروجی، نسخه فرایند، نگهداری حافظه سازمانی
        سطح: سطح ۲
        متدولوژی_مرتبط: SECI (برونی‌سازی) + Zettelkasten
      - نقش: ناظر انطباق و استاندارد
        دارایی_اصلی: چک‌لیست انطباق
        تمرکز: رجیستری استانداردها، حقوق مالکیت، کنترل دسترسی، منابع بیرونی
        سطح: سطح ۳
        متدولوژی_مرتبط: ISO 30401 (ممیزی/کنترل کیفیت)
      - نقش: کوچ فرایند
        دارایی_اصلی: لاگ مشاهده میدان اجرا
        تمرکز: خواندن ساختار، ثبت مشاهده، ارسال داده به حافظه
        سطح: سطح ۲
        متدولوژی_مرتبط: SECI (اجتماعی‌سازی/درونی‌سازی) + یادگیری تجربی
    قالب_های_استاندارد:
      - نام: قالب نوت استاندارد
        کاربرد: ساختار حداقلی هر نوت
        فیلدها:
          - عنوان
          - تعریف
          - ورودی
          - خروجی
          - اتصال‌ها
          - وضعیت
          - مالک
          - مسیر بازگشت داده
        مبنای_علمی: Zettelkasten (اتمی بودن)؛ هر نوت یک واحد اندیشه خودایستا
      - نام: قالب پلی‌بوک
        کاربرد: تبدیل دانش به روش قابل تکرار
        فیلدها:
          - هدف
          - مخاطب
          - مراحل
          - معیار کیفیت
          - خطاها
          - داده خروجی
        مبنای_علمی: SECI (برونی‌سازی)؛ تبدیل دانش ضمنی به روش صریح قابل تکرار
      - نام: قالب تصمیم
        کاربرد: ثبت تصمیم با دلیل و اثر
        فیلدها:
          - مسئله
          - گزینه‌ها
          - دلیل انتخاب
          - مالک
          - تاریخ بازبینی
          - اثر
        مبنای_علمی: ثبت تصمیم (Decision Log)؛ مبتنی بر شفافیت ISO 30401
      - نام: قالب SOP
        کاربرد: روش اجرایی استاندارد
        فیلدها:
          - ورودی
          - ابزار
          - مراحل
          - کنترل کیفیت
          - خروجی
          - مسئول
          - داده برگشتی
        مبنای_علمی: استاندارد فرایند؛ مستندسازی رویه‌ها
      - نام: قالب رجیستری
        کاربرد: ثبت داده‌های تکرارشونده
        فیلدها:
          - نوع
          - دوره
          - مالک
          - وضعیت
          - نسخه
        مبنای_علمی: Ahrens (نوت دائمی)؛ ثبت داده‌های تکرارشونده
      - نام: قالب مشخصات اتوماسیون
        کاربرد: ورودی برای نرم‌افزار/AI
        فیلدها:
          - مسئله
          - داده ورودی
          - داده خروجی
          - منطق پردازش
          - خطا
          - استثنا
          - معیار پذیرش
        مبنای_علمی: آماده‌سازی ورودی برای ابزار/AI؛ ساختار داده قابل مصرف ماشین
    متدولوژی_های_مرجع:
      - نام: Zettelkasten
        منشا: Niklas Luhmann (جامعه‌شناس آلمانی)
        کاربرد: مدیریت دانش شخصی / نوت‌برداری
        اصول_کلیدی:
          - "اتمی بودن (Atomicity): هر نوت یک ایده واحد"
          - "پیوندپذیری (Connectivity): پیوند دوطرفه میان نوت‌ها"
          - "برآمدگی/ظهور (Emergence): بینش از شبکه نوت‌ها پدیدار می‌شود"
        تطبیق_با_کاسیو: مبنای ساختار Vault و لینک‌دهی داخلی؛ هر دارایی یک نوت اتمی با
          پیوند به دیگر دارایی‌ها
        منبع: https://evernote.com/learn/what-is-the-zettelkasten-method ;
          ernestchiang.com/posts/2025/niklas-luhmann-original-zettelkasten-method
      - نام: سه نوع نوت (Ahrens)
        منشا: Sönke Ahrens — How to Take Smart Notes (2017)
        کاربرد: روش عملی نوت‌برداری
        اصول_کلیدی:
          - "نوت گذرا (Fleeting): ثبت سریع"
          - "نوت ادبیات (Literature): بازنویسی مختصر از منبع"
          - "نوت دائمی (Permanent): یک واحد اندیشه خودایستا"
        تطبیق_با_کاسیو: "خط لوله تولید دارایی: از نوت گذرا در جلسه ← نوت دائمی ← تبدیل
          به پلی‌بوک/رجیستری"
        منبع: https://www.ernestchiang.com/en/posts/2025/sonke-ahrens-how-to-take-smart-notes
      - نام: ISO 30401
        منشا: استاندارد بین‌المللی سیستم‌های مدیریت دانش (2018)
        کاربرد: چارچوب سازمانی مدیریت دانش
        اصول_کلیدی:
          - سیاست و رویه مکتوب
          - تعهد رهبری
          - ارزیابی منابع دانش
          - آموزش و آگاهی
          - پایش و ممیزی
        تطبیق_با_کاسیو: تطبیق ساختار Vault با الزامات مدیریت دانش؛ مستندسازی، کنترل
          کیفیت و پایش دارایی‌ها
        منبع: https://realkm.com/2019/04/17/evaluating-iso-30401-standard-part-3-what-are-the-mandatory-requirements/
      - نام: مدل SECI
        منشا: Nonaka & Takeuchi (1995)
        کاربرد: تبدیل دانش ضمنی به صریح و بالعکس
        اصول_کلیدی:
          - "اجتماعی‌سازی (Socialization): ضمنی←ضمنی"
          - "برونی‌سازی (Externalization): ضمنی←صریح"
          - "ترکیب (Combination): صریح←صریح"
          - "درونی‌سازی (Internalization): صریح←ضمنی"
        تطبیق_با_کاسیو: "هدف اصلی پلتفرم: تبدیل دانش ضمنی تیم به دارایی صریح (پلی‌بوک) و
          بازگشت آن به عمل"
        منبع: https://www.sciencedirect.com/science/article/pii/S2096248717300061
      - نام: طبقه‌بندی بلوم (بازنگری‌شده)
        منشا: Anderson & Krathwohl (2001)
        کاربرد: طراحی اهداف یادگیری و سطوح شناختی
        اصول_کلیدی:
          - به‌خاطرآوردن
          - درک
          - به‌کارگیری
          - تحلیل
          - ارزشیابی
          - خلق
        تطبیق_با_کاسیو: "مبنای ۴ سطح HEGAM: سطح ۱ (یادآوری/درک) تا سطح ۴ (خلق/به‌کارگیری
          برای اتوماسیون)"
        منبع: https://instructionaldesign.com.au/ebbinghaus-forgetting-curve/ (لینک
          راهنمای بلوم)
      - نام: منحنی فراموشی / تکرار فاصله‌دار
        منشا: Hermann Ebbinghaus (1885)
        کاربرد: افزایش ماندگاری یادگیری
        اصول_کلیدی:
          - بدون تکرار، ~۵۰٪ اطلاعات در یک ساعت و ~۷۰٪ در ۲۴ ساعت فراموش می‌شود
          - بازبینی فاصله‌دار، منحنی فراموشی را 'ریست' می‌کند
          - مرور ۲۴ ساعت اول ثمربخش‌ترین است
        تطبیق_با_کاسیو: طراحی برنامه ۹ جلسه با بازبینی فاصله‌دار؛ مرور جلسات قبلی در
          ابتدای هر جلسه
        منبع: https://www.structural-learning.com/post/spaced-practice-a-teachers-guide
      - نام: یادآوری فعال (Active Recall)
        منشا: Roediger & Karpicke (2006)
        کاربرد: تقویت حافظه با بازیابی فعال
        اصول_کلیدی:
          - فراخوانی فعال، قوی‌تر از مرور منفعل تقویت می‌کند
          - آزمون/بازیابی، اثر تثبیت حافظه دارد
        تطبیق_با_کاسیو: هر جلسه با 'بیان مغز' و بازخواست خروجی قبل از محتوای جدید آغاز می‌شود
        منبع: https://www.eduresearchjournal.com/index.php/ijep/article/view/270/279
      - نام: میکرولرنینگ (Microlearning)
        منشا: پژوهش‌های یادگیری خرد (Wollstein و دیگران)
        کاربرد: آموزش در بخش‌های کوتاه
        اصول_کلیدی:
          - جلسات کوتاه، بار شناختی بهینه
          - بازبینی در فواصل استراتژیک
          - کاربرد در زندگی واقعی
        تطبیق_با_کاسیو: مبنای تقطیع محتوا (وویس‌های زیر ۵ دقیقه) و ساختار آموزش‌های کانال
        منبع: https://www.eduresearchjournal.com/index.php/ijep/article/view/270/279
      - نام: ADDIE
        منشا: مدل طراحی آموزشی
        کاربرد: طراحی برنامه آموزشی
        اصول_کلیدی:
          - تحلیل (Analysis)
          - طراحی (Design)
          - توسعه (Development)
          - اجرا (Implementation)
          - ارزیابی (Evaluation)
        تطبیق_با_کاسیو: "چرخه طراحی هر جلسه و پروژه پایانی: تحلیل نیاز ← طراحی خروجی ←
          توسعه ← اجرا ← ارزیابی"
        منبع: استاندارد طراحی آموزشی (تطبیق عمومی)
    تکنیک_های_یادگیری:
      بازبینی_فاصله_دار: هر جلسه با مرور ۳-۵ دقیقه‌ای مفاهیم جلسات قبل آغاز می‌شود تا
        منحنی فراموشی Ebbinghaus خنثی شود.
      یادآوری_فعال: در ابتدای هر جلسه، «بیان مغز» (۳ دقیقه آزادنویسی) برای بازیابی
        فعال دانش قبلی.
      کاربرد_واقعی: هر مفهوم بلافاصله با یک تمرین در کسب‌وکار واقعی دانشجو پیاده
        می‌شود (یادگیری تجربی).
      میکرولرنینگ: محتوای هر جلسه به واحدهای خرد زیر ۱۵ دقیقه تقسیم می‌شود تا بار
        شناختی بهینه بماند.
      بازخورد_همتا: گروه‌های هم‌فکری بازخورد و تصحیح همتا را ارائه می‌دهند (بازخورد فوری).
      درهم‌آمیزی: مفاهیم مرتبط (لینک، MOC، مدل داده) در کنار هم آموزش داده می‌شوند تا
        ارتباط عمیق شکل بگیرد.
    تعداد_متدولوژی_مرجع: 9
  کیس_استادی:
    عنوان: پلتفرم دانش کاسیو پلاس
    نسخه: "1.0"
    خلاصه_اجرایی: پلتفرم دانش کاسیو پلاس یک لایه داخلی مبتنی بر Obsidian است که
      دانسته‌های پراکنده را به دارایی فکری قابل استفاده دوباره تبدیل می‌کند؛ نه
      جایگزین CRM، بلکه کارخانه تولید پلی‌بوک، استاندارد، حافظه داده و مشخصات
      اتوماسیون.
    مسئله:
      - دانش در سر اعضا می‌ماند و با رفتنشان از دست می‌رفت
      - ابزارهای اجرایی (CRM، Trello) برای طراحی سیستم مناسب نبودند
      - تجربه موفق ثبت نمی‌شد و پلی‌بوک قابل تکرار ساخته نمی‌شد
      - داده و بازخورد میدان اجرا به حافظه برنمی‌گشت و تیم یاد نمی‌گرفت
    راه_حل:
      محتوا: Vault مبتنی بر Obsidian به‌عنوان لایه طراحی سیستم و دارایی‌سازی
      مولفه_ها:
        - Vault ساخت‌یافته
        - نقشه کانواس
        - قالب‌های استاندارد
        - حافظه داده
        - شبکه دانش (لینک و MOC)
        - انتقال به عملیات
    قانون_طلایی:
      داخل_پلتفرم:
        - طراحی سیستم و مستندسازی
        - خط لوله دانش
        - حافظه داده و دارایی‌سازی
        - پلی‌بوک/استاندارد/مشخصات اتوماسیون
      خارج_از_پلتفرم:
        - CRM و مدیریت لحظه‌ای لیدها
        - عملیات روزمره همکاران
        - بورد تحویل مشتری
        - پیگیری تسک اجرایی
    دستاورد:
      - تبدیل دانش ضمنی به دارایی صریح
      - ساخت پلی‌بوک و استاندارد به‌جای تکرار آزمایشی
      - حافظه داده که بازخورد میدان به آن برمی‌گردد
      - آماده‌سازی خروجی برای نرم‌افزار و AI
    درس_ها:
      - پلتفرم دانش مکمل ابزار اجرایی است نه جایگزین
      - "دیوار آتش منابع: زمان ساخت دارایی از کار اجرایی جدا می‌ماند"
      - هر دارایی نسخه‌پذیر است و لینک داخلی دارد
      - داده میدان اجرا فقط پس از ساختاردهی وارد حافظه می‌شود
      - افزونه‌های پیشرفته فقط پس از تثبیت ساختار پایه

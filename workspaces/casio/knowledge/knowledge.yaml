    توضیح: محتوای ۱۰ سند واقعی کاسیو (استخراج‌شده از آرشیو) که به‌صورت ساختاریافته
      به مدل تزریق شده است.
    تعداد: 10
    لیست:
      - نام: آیین نامه سفیران.pdf
        پلی_بوک_مرتبط: آیین‌نامه باشگاه سفیران کاسیو
        نسخه: نسخه اول (مصوبه اجرایی)
        خلاصه: باشگاه سفیران با هدف توسعه اکوسیستم کارآفرینان سیستمی و ایجاد شبکه ارجاع
          حرفه‌ای راه‌اندازی می‌شود. ارجاع معتبر، فردی است که مالک/تصمیم‌گیر
          اصلی کسب‌وکار، دارای فعالیت اقتصادی فعال و رسمی، دارای تمایل جدی به
          رشد و سیستمسازی باشد و پس از جلسه معارفه وارد فرآیند همکاری شود.
        مفاهیم_کلیدی:
          - ارجاع معتبر
          - شبکه ارجاع حرفه‌ای
          - سفیر
        ساختار:
          سطوح_همکاری:
            - سطح ۱: همکار معرفی‌کننده
              شرط: معرفی حداقل ۲ متقاضی واجد شرایط در ۳ ماه
              مزایا: معرفی نام/برند در کمپین‌ها
            - سطح ۲: سفیر رشد
              شرط: معرفی حداقل ۵ متقاضی که حداقل ۲ نفر ثبت‌نام کنند
              مزایا: معرفی رسمی، ۱ جلسه مشاوره تخصصی
            - سطح ۳: شریک اکوسیستم
              شرط: معرفی مستمر (حداقل ۱۰ متقاضی در ۶ ماه با نرخ تبدیل تأییدشده)
              مزایا: حضور در کمپین‌های رسمی، مشاوره پیشرفته
          فرآیند_ثبت_ارجاع:
            - ثبت از طریق فرم رسمی
            - ذکر نام معرف در ابتدای تماس
            - تأیید نهایی پس از جلسه معارفه و بررسی صلاحیت
          اصول:
            - توسعه حرفه‌ای شبکه نه فروش مقطعی
            - اختیار کامل کاسیو در پذیرش
            - مزایا قابل انتقال نیست
      - نام: داشبورد وضعیت و نظام امتیازدهی Casio Metric.pdf

id: primitive.automation-spec
version: 0.1.0
fields:
  - { name: id, type: string, required: true }
  - { name: title, type: string, required: true }
  - { name: status, type: enum, required: true, allowed_values: [draft, disabled_until_approved, approved, active, retired, evidence_collected] }
  - { name: asset_status, type: enum, required: true, allowed_values: [draft, evidence_collected, approved_v1] }
  - { name: input_data, type: array, required: true }
  - { name: output_data, type: array, required: true }
  - { name: acceptance_criteria, type: array, required: true }
  - { name: risk_level, type: enum, required: false, allowed_values: [low, medium, high] }
lifecycle: [draft, disabled_until_approved, approved, active]
validity_rules:
  - "automation approved requires evidence_count > 0"

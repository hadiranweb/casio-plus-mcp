id: primitive.asset-status
version: 0.1.0
fields:
  - { name: asset_status, type: enum, required: true, allowed_values: [draft, templates_only, evidence_collected, approved_v1, active, operational, final] }
  - { name: readiness, type: enum, required: false, allowed_values: [needs_definition, templates_only, evidence_based, mature] }
  - { name: evidence_count, type: number, required: false, range: [0, 1000] }
  - { name: version, type: string, required: false }
lifecycle: [draft, evidence_collected, approved_v1, active]
validity_rules:
  - "approved_v1 requires evidence_count > 0"

id: primitive.evidence
version: 0.1.0
description: "شواهد — مشاهده واقعی میدان؛ مهم‌ترین primitive"
fields:
  - { name: evidence_id, type: string, required: true }
  - name: source
    type: enum
    required: true
    allowed_values: [field_observation, coaching_session, customer_interaction, manual_inventory, pilot_result, tool_usage_log, migration_legacy]
  - { name: observer, type: string, required: true }
  - { name: observed_at, type: datetime, required: true }
  - name: raw_payload
    type: object
    required: true
    fields:
      - { name: summary, type: string, required: true }
      - { name: details, type: string, required: false }
  - { name: related_domain, type: string, required: true }
  - { name: confidence, type: number, required: true, range: [0.0, 1.0], default: 0.5 }
  - name: provenance
    type: object
    required: true
    fields:
      - { name: origin_system, type: string, required: true, default: casio-operator }
      - { name: capture_method, type: string, required: true, default: manual_observation }
      - { name: capture_context, type: string, required: false }
  - { name: privacy_classification, type: enum, required: true, allowed_values: [internal, confidential], default: internal }
  - { name: review_status, type: enum, required: true, allowed_values: [unreviewed, triaged, accepted, rejected], default: unreviewed }
  - { name: linked_assets, type: "string[]", required: false, default: [] }
  - { name: created_at, type: datetime, required: true }
lifecycle: [captured, triaged, accepted, rejected, converted_to_proposal]
validity_rules:
  - "accepted evidence requires observer"
  - "converted_to_proposal requires linked_assets length > 0"

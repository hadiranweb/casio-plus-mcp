id: primitive.decision
version: 0.1.0
fields:
  - { name: id, type: string, required: true }
  - { name: title, type: string, required: true }
  - { name: owner, type: string, required: false }
  - { name: status, type: enum, required: true, allowed_values: [draft, proposed, accepted, rejected, superseded, evidence_collected] }
  - { name: asset_status, type: enum, required: true, allowed_values: [draft, evidence_collected, approved_v1] }
  - { name: context, type: string, required: false }
  - { name: alternatives, type: array, required: false }
  - { name: chosen, type: string, required: false }
  - { name: rationale, type: string, required: false }
lifecycle: [draft, proposed, accepted]
validity_rules:
  []

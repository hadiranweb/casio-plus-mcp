# Principles — قانون اساسی (تغییرناپذیر)
version: 0.1.0
principles:
  - "هر دانش معتبر باید مالک، نسخه و مسیر بازگشت داده داشته باشد"
  - "داده خام عملیات هرگز مستقیم وارد حافظه دانش نمی‌شود (Firewall)"
  - "هر Automation نیازمند Spec، Approval و Audit است"
  - "هر تغییر دانش از مسیر Proposal و Review عبور می‌کند"
  - "سیستم پر نمی‌شود؛ سیستم قادر به پر شدن می‌شود (No Fake Knowledge)"
  - "هر ابزار با معیار پذیرش خودش سنجیده می‌شود (Measurement Closure)"

# Governance — حاکمیت دانش
version: 0.1.0
rules:
  - "تنها بازخورد validated قابل تأیید است"
  - "بازخورد quarantined فقط قابل رد یا اصلاح و ثبت مجدد است"
  - "تأیید بازخورد، منبع دانش را تغییر نمی‌دهد؛ فقط پیشنهاد نسخه می‌سازد"
  - "هر تأیید/رد/پیشنهاد یک Audit Event می‌سازد"
  - "هر Proposal نسخه پایه (baseKnowledgeVersion) را نگه می‌دارد"
  - "ادغام نهایی فقط یک اقدام انسانی و نسخه‌دار در Git است"

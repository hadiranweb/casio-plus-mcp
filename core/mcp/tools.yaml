  - { name: get_architecture, level: 0, effect: read, audit: false }
  - { name: get_learning_path, level: 0, effect: read, audit: false }
  - { name: list_audit_events, level: 0, effect: read, audit: false }
  - { name: capture_field_observation, level: 1, effect: write_evidence, audit: true }
